---
name: RISC-V ISA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/riscv/riscv-docs-base-container-image:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set build metadata
        run: |
          SHORT_SHA="$(printf '%.7s' "$GITHUB_SHA")"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=snapshot-$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Build PDF
        id: build_files
        run: make pdf VERSION="$BUILD_VERSION" BUILD_COMMIT="$SHORT_SHA"

      - name: Upload Ztt PDF
        if: steps.build_files.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Ztt-${{ env.BUILD_VERSION }}
          path: ${{ github.workspace }}/build/Ztt-${{ env.BUILD_VERSION }}.pdf
          if-no-files-found: error
          retention-days: 7
