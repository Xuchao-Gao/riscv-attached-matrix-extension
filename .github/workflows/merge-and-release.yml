---
name: Release ISA Version Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/riscv/riscv-docs-base-container-image:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          submodules: false

      - name: Validate tag and set build metadata
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not a supported version tag"
            exit 1
          fi
          echo "SPEC_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(printf '%.7s' "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Build PDF
        id: build_files
        run: make pdf VERSION="$SPEC_VERSION" BUILD_COMMIT="$SHORT_SHA"

      - name: Upload Ztt PDF
        if: steps.build_files.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Ztt-${{ env.SPEC_VERSION }}-${{ env.SHORT_SHA }}
          path: ${{ github.workspace }}/build/Ztt-${{ env.SPEC_VERSION }}.pdf
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ github.ref_name }}
          name: AME (Ztt) ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            This release was created by: ${{ github.event.sender.login }}
            Release of AME (Ztt) ${{ github.ref_name }}, built from commit ${{ env.SHORT_SHA }}, is now available.
          files: |
            ${{ github.workspace }}/build/Ztt-${{ env.SPEC_VERSION }}.pdf
